# This is a basic workflow to help you get started with Actions

name: Service Request workflow

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
   inputs:
      service_request:
        description: Service request name
        required: true
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Print Inputs
        run: |
         echo "Service Request = ${{ inputs.service_request }}"
        
      - name: Get Port Token
        id: auth
        run: |
          TOKEN=$(curl -s -X POST \
            https://api.getport.io/v1/auth/access_token \
            -H "Content-Type: application/json" \
            -d '{
              "clientId":"${{ secrets.PORT_CLIENT_ID }}",
              "clientSecret":"${{ secrets.PORT_CLIENT_SECRET }}"
            }' | jq -r '.accessToken')

          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Create Port Entity
        run: |
            ENTITY_ID="sr-$(uuidgen)"
            
            echo "ENTITY_ID=$ENTITY_ID" >> $GITHUB_ENV
            
            curl -X POST \
              https://api.getport.io/v1/blueprints/service_request/entities \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "identifier":"'"$ENTITY_ID"'",
                "title":"${{ inputs.service_request }}",
                "properties":{
                  "status":"Open"
                }
              }'
      - name: Update Service Request
        run: |
            REQ_NUM="REQ-$(uuidgen)"
            curl -X PATCH \
              https://api.getport.io/v1/blueprints/service_request/entities/$ENTITY_ID \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "properties": {
                  "request_number":"'"$REQ_NUM"'",
                  "status": "Approved"
                }
              }'
